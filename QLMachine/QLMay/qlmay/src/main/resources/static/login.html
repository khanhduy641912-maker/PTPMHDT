<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title> Đăng nhập & Đăng ký</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- THƯ VIỆN SWEETALERT2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body class="bg-light d-flex align-items-center vh-100">
    <div class="container" style="max-width: 450px;">
        <div class="card shadow-sm p-4 border-2 border-success">
            <h3 class="text-center text-success mb-4 fw-bold">HỆ THỐNG CHO THUÊ MÁY NÔNG NGHIỆP</h3>
            
            <!-- FORM ĐĂNG NHẬP -->
            <div id="loginForm">
                <h5 class="card-title text-center mb-3 fw-bold">Đăng Nhập</h5>
                <div class="mb-3">
                    <label class="form-label font-weight-bold">Số điện thoại</label>
                    <input type="text" id="loginPhone" class="form-control" placeholder="Nhập số điện thoại">
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" id="loginPass" class="form-control" placeholder="Mật khẩu">
                </div>
                <button onclick="handleLogin()" class="btn btn-success w-100 fw-bold">Đăng Nhập</button>
                <p class="text-center mt-3 mb-0">Chưa có tài khoản? <a href="#" onclick="toggleAuth('register')" class="fw-bold">Đăng ký ngay</a></p>
            </div>

            <!-- FORM ĐĂNG KÝ -->
            <div id="registerForm" class="d-none">
                <h5 class="card-title text-center mb-3 fw-bold">Đăng Ký Tài Khoản</h5>
                <div class="mb-2">
                    <label class="form-label">Họ và tên</label>
                    <input type="text" id="regName" class="form-control" placeholder="Nhập họ và tên">
                </div>
                <div class="mb-2">
                    <label class="form-label">Số điện thoại</label>
                    <input type="text" id="regPhone" class="form-control" placeholder="Nhập số điện thoại">
                </div>
                <div class="mb-2">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" id="regPass" class="form-control" placeholder="Tạo mật khẩu">
                </div>
                <div class="mb-3">
                    <label class="form-label">Vai trò</label>
                    <select id="regRole" class="form-select">
                        <option value="FARMER">Nông dân (Thuê máy)</option>
                        <option value="OWNER">Chủ máy (Cho thuê)</option>
                        <option value="OPERATOR">Tài xế / Người vận hành</option>
                    </select>
                </div>
                <button onclick="handleRegister()" class="btn btn-primary w-100 fw-bold">Tạo Tài Khoản</button>
                <p class="text-center mt-3 mb-0">Đã có tài khoản? <a href="#" onclick="toggleAuth('login')" class="fw-bold">Đăng nhập</a></p>
            </div>
        </div>
    </div>

    <script src="/app.js"></script>
    <script>
        function toggleAuth(type) {
            if(type === 'register') {
                document.getElementById('loginForm').classList.add('d-none');
                document.getElementById('registerForm').classList.remove('d-none');
            } else {
                document.getElementById('registerForm').classList.add('d-none');
                document.getElementById('loginForm').classList.remove('d-none');
            }
        }

        async function handleLogin() {
            const phone = document.getElementById('loginPhone').value;
            const pass = document.getElementById('loginPass').value;
            
            if (!phone || !pass) {
                Swal.fire('Cảnh Báo', 'Vui lòng nhập đầy đủ số điện thoại và mật khẩu!', 'warning');
                return;
            }

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ phone, password: pass })
                });

                if (res.ok) {
                    const user = await res.json();
                    localStorage.setItem('user', JSON.stringify(user));

                    Swal.fire({
                        icon: 'success',
                        title: 'Đăng Nhập Thành Công!',
                        text: `Xin chào ${user.fullName || 'bạn'}, hệ thống đang điều hướng...`,
                        timer: 1200,
                        showConfirmButton: false
                    }).then(() => {
                        if (user.role === 'ADMIN') {
                            window.location.href = '/admin.html';
                        } else if (user.role === 'OWNER') {
                            window.location.href = '/owner.html';
                        } else if (user.role === 'OPERATOR') {
                            window.location.href = '/operator.html';
                        } else {
                            window.location.href = '/index.html';
                        }
                    });
                } else {
                    Swal.fire('Đăng Nhập Thất Bại!', 'Số điện thoại hoặc mật khẩu không chính xác.', 'error');
                }
            } catch(e) {
                Swal.fire('Lỗi Kết Nối!', 'Không thể kết nối tới server.', 'error');
            }
        }

        async function handleRegister() {
            const fullName = document.getElementById('regName').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPass').value;
            const role = document.getElementById('regRole').value;

            if (!fullName || !phone || !password) {
                Swal.fire('Cảnh Báo', 'Vui lòng điền đầy đủ các trường thông tin!', 'warning');
                return;
            }

            try {
                const res = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ fullName, phone, password, role })
                });

                if (res.ok) {
                    await handleLoginWithCredentials(phone, password);
                    return;
                } else {
                    Swal.fire('Đăng Ký Thất Bại!', await App.errorMessage(res, 'Không thể tạo tài khoản.'), 'error');
                }
            } catch(e) {
                Swal.fire('Lỗi Kết Nối!', 'Không thể kết nối tới máy chủ.', 'error');
            }
        }

        async function handleLoginWithCredentials(phone, password) {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ phone, password })
            });
            if (res.ok) {
                const user = await res.json();
                localStorage.setItem('user', JSON.stringify(user));
                Swal.fire({
                    icon: 'success',
                    title: 'Đăng Ký Thành Công!',
                    text: 'Tài khoản đã tạo và đăng nhập thành công.',
                    timer: 1000,
                    showConfirmButton: false
                }).then(() => {
                    if (user.role === 'OWNER') window.location.href = '/owner.html';
                    else if (user.role === 'OPERATOR') window.location.href = '/operator.html';
                    else window.location.href = '/index.html';
                });
            } else {
                Swal.fire('Đăng Ký Thành Công!', 'Vui lòng đăng nhập bằng mật khẩu vừa tạo.', 'success')
                    .then(() => toggleAuth('login'));
            }
        }
    </script>
</body>
</html>
